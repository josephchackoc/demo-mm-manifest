name: Verification

# Trigger the workflow on push or pull request events for the main branch
on:
  workflow_dispatch:
    inputs:
      message:
        default: "value 1"
    
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: |
          echo "on MTTest branch ${{ inputs.message }}"
      
   

name: Verification

# Trigger the workflow on push or pull request events for the main branch
on:
  workflow_dispatch:
    
  pull_request:
    branches: [ "main" ]

jobs:
  qnx:
    # The type of runner that the job will run on
    uses: ./.github/workflows/qnx.yml
  android:
    # The type of runner that the job will run on
    uses: ./.github/workflows/android.yml
      
   
